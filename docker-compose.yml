version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead_hunter_backend
    environment:
      - PORT=3000
      - DATABASE_URL=file:/app/dev.db
      - JWT_SECRET=${JWT_SECRET:-changeme_in_production_secret_key_12345}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - backend_data:/app
      - backend_uploads:/usr/src/app/public/uploads
      - backend_media:/usr/src/app/public/media
      - backend_baileys:/usr/src/app/baileys_auth_info
    restart: unless-stopped

  frontend:
    build:
      context: ./lead-scout
      dockerfile: Dockerfile
    container_name: lead_hunter_frontend
    ports:
      - "${FRONTEND_PORT:-7080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_media:
  backend_baileys:
